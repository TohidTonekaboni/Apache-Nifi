services:
  nifi:
    image: apache/nifi:1.27.0
    container_name: nifi
    restart: unless-stopped
    ports:
      - "${NIFI_WEB_HTTPS_PORT:-8443}:${NIFI_WEB_HTTPS_PORT:-8443}"
      # Section 4 — ListenHTTP webhook-receiver exercise
      - "${LISTENHTTP_PORT:-9091}:9091"
      # Section 8 — PrometheusReportingTask metrics endpoint
      - "${PROMETHEUS_METRICS_PORT:-9093}:9093"
    environment:
      NIFI_WEB_HTTPS_PORT: ${NIFI_WEB_HTTPS_PORT:-8443}
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      # Bind mounts used by the Section 3 exercise flows (GetFile/ListFile source, PutFile destination)
      - ../03-first-flows/data-in:/opt/nifi/nifi-current/data-in
      - ../03-first-flows/data-out:/opt/nifi/nifi-current/data-out
      # Section 4 — JDBC drivers for DBCPConnectionPool (see 04-data-ingestion/drivers/download.sh)
      - ../04-data-ingestion/drivers:/opt/nifi/nifi-current/drivers
      # Section 5 — transform & routing exercise input/outputs
      - ../05-transform-routing/data-in:/opt/nifi/nifi-current/05-data-in
      - ../05-transform-routing/data-good:/opt/nifi/nifi-current/05-data-good
      - ../05-transform-routing/data-quarantine:/opt/nifi/nifi-current/05-data-quarantine
      # Section 7 — dead-letter sink for the retry/back-pressure exercise
      - ../07-reliability-performance/data-deadletter:/opt/nifi/nifi-current/07-data-deadletter
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # NiFi Registry — optional, introduced in this section, used fully in section 9.
  # Start with: docker compose --profile registry up -d
  nifi-registry:
    image: apache/nifi-registry:1.27.0
    container_name: nifi-registry
    profiles: ["registry"]
    restart: unless-stopped
    ports:
      - "${NIFI_REGISTRY_HTTP_PORT:-18080}:18080"
    volumes:
      - nifi_registry_database:/opt/nifi-registry/nifi-registry-current/database
      - nifi_registry_flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage

  # Section 4 — relational DB source for the QueryDatabaseTable incremental-ingestion exercise.
  # Always up (core to the section's main exercise). NiFi reaches it at host "postgres", port 5432.
  postgres:
    image: postgres:16-alpine
    container_name: nifi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nifi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nifi_password}
      POSTGRES_DB: ${POSTGRES_DB:-sourcedb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nifi_postgres_data:/var/lib/postgresql/data
      - ../04-data-ingestion/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nifi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Section 4 — Kafka-compatible broker for the ConsumeKafka exercise. Optional (heavier, only
  # needed for that part of the section). Start with: docker compose --profile kafka up -d
  # NiFi reaches it at host "redpanda", port 9092.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: nifi-redpanda
    profiles: ["kafka"]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "${REDPANDA_KAFKA_PORT:-9092}:9092"
    volumes:
      - nifi_redpanda_data:/var/lib/redpanda/data

  # Section 4 — simple HTTP echo/test service for the InvokeHTTP exercise. Optional.
  # Start with: docker compose --profile http up -d
  # NiFi reaches it at host "httpbin", port 80.
  httpbin:
    image: kennethreitz/httpbin:latest
    container_name: nifi-httpbin
    profiles: ["http"]
    restart: unless-stopped
    ports:
      - "${HTTPBIN_PORT:-8080}:80"

  # Section 6 — SFTP destination for the PutSFTP egress exercise. Optional.
  # Start with: docker compose --profile sftp up -d
  # NiFi reaches it at host "sftp", port 22. Uploaded files land in 06-data-egress/data-out-sftp/
  # on the host (user "nifiuser", home dir "upload").
  sftp:
    image: atmoz/sftp:latest
    container_name: nifi-sftp
    profiles: ["sftp"]
    restart: unless-stopped
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      - ../06-data-egress/data-out-sftp:/home/nifiuser/upload
    command: nifiuser:${SFTP_PASSWORD:-sftp_password}:1001:100:upload

  # Section 6 — S3-compatible object storage (via LocalStack) for the PutS3Object egress
  # exercise. Optional — avoids needing real AWS credentials for the hands-on demo.
  # Start with: docker compose --profile s3 up -d. NiFi reaches it at host "localstack", port 4566.
  localstack:
    image: localstack/localstack:3
    container_name: nifi-localstack
    profiles: ["s3"]
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - nifi_localstack_data:/var/lib/localstack

volumes:
  nifi_conf:
  nifi_content:
  nifi_database:
  nifi_flowfile:
  nifi_provenance:
  nifi_state:
  nifi_logs:
  nifi_registry_database:
  nifi_registry_flow_storage:
  nifi_postgres_data:
  nifi_redpanda_data:
  nifi_localstack_data:
